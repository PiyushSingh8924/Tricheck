{% extends "teacher_base.html" %}
{% block tbody %}
<section class="panel"><div class="rowhead"><div><p id="status">Loading...</p><h2 id="title">&nbsp;</h2><p class="sub" id="meta"></p></div>
<div class="actions"><button class="alt" id="csvbtn" onclick="csv()" hidden>Download CSV</button><button id="endbtn" onclick="endSession()" hidden>End session</button></div></div>
<div class="stats small"><div class="stat"><b id="count">0</b><span>Present</span></div><div class="stat"><b id="left">-</b><span>Not marked yet</span></div><div class="stat"><b id="timer">-</b><span>Time left</span></div></div>
<p id="msg"></p></section>
<div class="duo even">
<section class="panel"><h2>Present</h2><div class="tablewrap"><table><thead><tr><th>Reg no</th><th>Name</th><th>Time</th></tr></thead><tbody id="live"></tbody></table></div></section>
<section class="panel"><h2>Not marked yet</h2><div class="tablewrap"><table><thead><tr><th>Reg no</th><th>Name</th></tr></thead><tbody id="absent"></tbody></table></div></section>
</div>
{% endblock %}
