<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<title>TriCheck | Manipal University Jaipur</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Display: Michroma (wide engineered caps). Text: Manrope. Readouts: IBM Plex Mono. -->
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Manrope:wght@400..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="/static/tricheck-icon.png"><link rel="stylesheet" href="/static/style.css">
<script>if("IntersectionObserver"in window)document.documentElement.classList.add("js")</script></head>
<body class="{% block bodyclass %}{% endblock %}" data-page="{{ page or '' }}"{% block bodyattrs %}{% endblock %}>
<svg width="0" height="0" style="position:absolute"><symbol id="lg" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 11V6a2 2 0 0 1 2-2h5M21 4h5a2 2 0 0 1 2 2v5M28 21v5a2 2 0 0 1-2 2h-5M11 28H6a2 2 0 0 1-2-2v-5"/><circle cx="16" cy="14" r="3.2"/><path d="M10 23c1.2-3 3.4-4 6-4s4.8 1 6 4"/></symbol></svg>
<header><a class="hl" href="/"><img class="mujl" src="/static/muj-logo-light.png" alt="Manipal University Jaipur"></a><a class="hc" href="/"><img class="tri-logo" src="/static/tricheck-logo-light.png" alt="TriCheck"></a><span>{% block right %}{% endblock %}</span></header>
<main>{% block body %}{% endblock %}</main>
<script>/* panels slide up once as they scroll into view; kept separate so it can never be blocked by another script */
(function(){var els=document.querySelectorAll(".panel,.stat,.role,.glass,.herocard,.authbox,.tnav");if(!("IntersectionObserver"in window)||!els.length)return;
var io=new IntersectionObserver(function(es){var i=0;es.forEach(function(e){if(!e.isIntersecting)return;io.unobserve(e.target);var t=e.target;setTimeout(function(){t.classList.add("is-in")},Math.min(i++,5)*70)})},{rootMargin:"0px 0px -8% 0px"});
els.forEach(function(el){io.observe(el)})})()</script>
{% block libs %}{% endblock %}<script src="/static/app.js"></script>{% block scripts %}{% endblock %}</body></html>
