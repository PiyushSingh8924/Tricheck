{% extends "base.html" %}{% block body %}
<div class="authbox"><div class="authside"><svg><use href="#lg"/></svg>
<div><h2>{{ title }}</h2><p>{{ blurb }}</p></div></div>
<div class="authform"><form id="auth" data-api="{{ api }}" data-next="{{ nxt }}" data-done="{{ done }}">
{% set ac = {'email': 'username', 'reg_no': 'username', 'name': 'name', 'code': 'off'} %}
{% for n, label, t in fields %}<input name="{{ n }}" type="{{ t }}" placeholder="{{ label }}" aria-label="{{ label }}" autocomplete="{{ ('new-password' if ('reset' in api or 'register' in api) else 'current-password') if n == 'password' else ac.get(n, 'off') }}" required>{% endfor %}
<button>{{ title }}</button></form><p id="msg"></p>
<p class="links">{% for href, label in links %}<a href="{{ href }}">{{ label }}</a>{% endfor %}<a href="/">Back to home</a></p></div></div>
{% endblock %}
